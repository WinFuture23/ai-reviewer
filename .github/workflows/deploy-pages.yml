name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ai-reviewer.js'
      - 'vergleichswidget.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare deployment (ai-reviewer.js + vergleichswidget.js)
        run: |
          mkdir _site
          cp ai-reviewer.js vergleichswidget.js _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job: after a Pages timeout, "Re-run failed jobs" then only
  # re-runs the deploy without uploading a second "github-pages" artifact
  # into the same run (deploy-pages aborts on duplicate artifact names).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
